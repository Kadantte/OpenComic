app-id: app.opencomic.OpenComic
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: run.sh
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # changed from dri to all to fix controler navigation
  - --device=all
  - --share=network
  - --share=ipc
  # should fix controler navigation
  - --filesystem=/run/udev:ro
  # should fix discord rich presence
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
modules:
  - name: OpenComic
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main/
      - cp -r  * /app/main/
      - install -Dm0644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm0644 ${FLATPAK_ID}.metainfo.xml --target-directory=${FLATPAK_DEST}/share/metainfo/
      - install -Dm0644 ${FLATPAK_ID}.desktop --target-directory=${FLATPAK_DEST}/share/applications/
      - install -Dm0755 run.sh --target-directory=${FLATPAK_DEST}/bin/
    sources:
      - type: archive
        url: https://github.com/ollm/OpenComic/releases/download/v2.0.0/opencomic-2.0.0.tar.gz
        sha256: 7e7dbdf92cbd11b45108a12d69f0b63748085e355f01b9c23cf2422346e1c8fc
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/ollm/OpenComic/releases/download/v2.0.0/opencomic-2.0.0-arm64.tar.gz
        sha256: 7108a3854b64809419f0c301016c13dd736c6fae3525fc0b061bb2ef5fbcd584
        only-arches:
          - aarch64
      - type: file
        url: https://raw.githubusercontent.com/ollm/OpenComic/3f6979f9d16ee4688b60e995978f82fd5c299e20/build/flatpak/app.opencomic.OpenComic.desktop
        sha256: ac3537ad8229915487933326424d8a2c3983e4e0c3a0b9610656e95f444463e6
      - type: file
        url: https://raw.githubusercontent.com/ollm/OpenComic/3f6979f9d16ee4688b60e995978f82fd5c299e20/build/flatpak/app.opencomic.OpenComic.metainfo.xml
        sha256: b642f90870e2c36706185387f96dc74ab882d16a05ca57392ff74b12b7fadf24
      - type: file
        url: https://raw.githubusercontent.com/ollm/OpenComic/3f6979f9d16ee4688b60e995978f82fd5c299e20/build/flatpak/app.opencomic.OpenComic.png
        sha256: 6736412d20cc5e24599ad0a07fc668d27d577d7f271e8916de110a5b9c75a679
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper /app/main/opencomic "$@"
